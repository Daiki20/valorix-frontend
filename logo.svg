<svg xmlns="http://www.w3.org/2000/svg" width="200" height="52" viewBox="0 0 200 52">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon box -->
  <rect x="0" y="4" width="44" height="44" rx="12" fill="url(#boxGrad)" filter="url(#boxShadow)"/>
  <!-- Inner shine -->
  <rect x="0" y="4" width="44" height="22" rx="12" fill="url(#shineGrad)"/>

  <!-- V shape (white arms) -->
  <polyline points="10,16 18,36 22,26" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="34,16 26,36 22,26" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Blue center stem -->
  <line x1="22" y1="26" x2="22" y2="36" stroke="#60a5fa" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Wordmark: valorix -->
  <text x="56" y="34" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="22" fill="#1a1a2e" letter-spacing="-0.8">valorix</text>

  <!-- AI superscript -->
  <text x="166" y="22" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="13" fill="url(#aiGrad)" letter-spacing="0.5">AI</text>
</svg>
