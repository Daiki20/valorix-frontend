name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SSTATS_API_KEY: ${{ secrets.VITE_SSTATS_API_KEY }}

      - name: Copy index.html to 404.html (SPA routing fix)
        run: cp dist/index.html dist/404.html

      - name: Generate sitemap.xml (fetches articles from Railway)
        run: node scripts/generate-sitemap.js
        continue-on-error: true

      - name: Generate blog pages HTML (SSR for GitHub Pages / SEO)
        run: node scripts/generate-blog-pages.js
        continue-on-error: true

      - name: Debug generated blog pages
        run: |
          echo "=== dist/blog contents ==="
          ls -la dist/blog || echo "dist/blog does not exist!"
          echo "=== index.html files ==="
          find dist/blog -name "index.html" | head -20 || echo "No index.html files found!"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: valorix.ru
